! ═══════════════════════════════════════════════════════════════
! Cisco Catalyst 2960X - Configuration LAG + VLAN
! Projet : HomeLab VLAN Refactor Security
! Auteur : @valorisa
! Version : 1.0
! ═══════════════════════════════════════════════════════════════

! ───────────────────────────────────────────────────────────────
! 1. CONFIGURATION DE BASE
! ───────────────────────────────────────────────────────────────

enable
configure terminal

hostname SW-CISCO-2960X
ip domain-name homelab.local
no ip domain-lookup
ip name-server 8.8.8.8
ip name-server 8.8.4.4

! ───────────────────────────────────────────────────────────────
! 2. CONFIGURATION DU PORT-CHANNEL (LAG)
! ───────────────────────────────────────────────────────────────

interface Port-channel1
 description LAG-to-Fortigate-60F
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,99,100,200,1000
 spanning-tree mode rapid-pvst
 spanning-tree portfast trunk
 no shutdown
exit

! ───────────────────────────────────────────────────────────────
! 3. CONFIGURATION DES PORTS MEMBRES DU LAG
! ───────────────────────────────────────────────────────────────

interface GigabitEthernet0/1
 description LAG-Member-1-to-Fortigate-port3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,99,100,200,1000
 channel-group 1 mode active
 spanning-tree portfast trunk
 no shutdown
exit

interface GigabitEthernet0/2
 description LAG-Member-2-to-Fortigate-port4
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,99,100,200,1000
 channel-group 1 mode active
 spanning-tree portfast trunk
 no shutdown
exit

! ───────────────────────────────────────────────────────────────
! 4. CONFIGURATION DES VLAN
! ───────────────────────────────────────────────────────────────

vlan 10
 name VLAN-Admin
exit

vlan 50
 name VLAN-PC
exit

vlan 99
 name VLAN-Native
exit

vlan 100
 name VLAN-IoT
exit

vlan 200
 name VLAN-VoIP
exit

vlan 1000
 name VLAN-Merdouille-Transition
exit

! ───────────────────────────────────────────────────────────────
! 5. INTERFACE DE MANAGEMENT (VLAN 10)
! ───────────────────────────────────────────────────────────────

interface Vlan10
 description Management-Switch
 ip address 10.20.10.2 255.255.255.0
 no shutdown
exit

ip default-gateway 10.20.10.1

! ───────────────────────────────────────────────────────────────
! 6. CONFIGURATION DES PORTS D'ACCÈS (EXEMPLES)
! ───────────────────────────────────────────────────────────────

interface GigabitEthernet0/3
 description AP-Ubiquiti-U7-Lite-1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,100
 spanning-tree portfast trunk
 spanning-tree bpduguard enable
 no shutdown
exit

interface GigabitEthernet0/4
 description AP-Ubiquiti-U7-Lite-2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,100
 spanning-tree portfast trunk
 spanning-tree bpduguard enable
 no shutdown
exit

interface GigabitEthernet0/5
 description Server-Proxmox-TrueNAS
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,50,100,200
 spanning-tree portfast trunk
 no shutdown
exit

interface GigabitEthernet0/6
 description Printer-Network
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit

! ───────────────────────────────────────────────────────────────
! 7. SÉCURITÉ DES PORTS
! ───────────────────────────────────────────────────────────────

spanning-tree portfast bpduguard default

interface range GigabitEthernet0/7-24
 description UNUSED-PORT
 shutdown
 switchport mode access
 switchport access vlan 99
 spanning-tree bpduguard enable
exit

! ───────────────────────────────────────────────────────────────
! 8. QUALITY OF SERVICE (QoS) POUR VoIP
! ───────────────────────────────────────────────────────────────

mls qos
mls qos map dscp-cos 46 to 7
mls qos map dscp-cos 34 to 5
mls qos map dscp-cos 0 to 0

interface Vlan200
 mls qos trust dscp
exit

! ───────────────────────────────────────────────────────────────
! 9. MONITORING (SNMP)
! ───────────────────────────────────────────────────────────────

snmp-server community HOMELAB-RO RO
snmp-server community HOMELAB-RW RW
snmp-server location "HomeLab - Datacenter"
snmp-server contact "valorisa@homelab.local"
snmp-server enable traps

! ───────────────────────────────────────────────────────────────
! 10. SYSTÈME ET HORLOGE
! ───────────────────────────────────────────────────────────────

clock timezone CET 1
clock summer-time CET recurring
ntp server pool.ntp.org
ntp server time.google.com

! ───────────────────────────────────────────────────────────────
! 11. SAUVEGARDE ET LOGGING
! ───────────────────────────────────────────────────────────────

logging buffered 16384
logging console informational
write memory

end