# ═══════════════════════════════════════════════════════════════
# Fortigate 60F - Configuration LAG + VLAN
# Projet : HomeLab VLAN Refactor Security
# Auteur : @valorisa
# Version : 1.0
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 1. CONFIGURATION DE BASE
# ───────────────────────────────────────────────────────────────

config system global
    set hostname FGT-60F-HOME
    set admin-sport 8443
    set admin-https-ssl-versions tls10 tls11 tls12
end

# ───────────────────────────────────────────────────────────────
# 2. CONFIGURATION DU LAG (port3 + port4)
# ───────────────────────────────────────────────────────────────

config system interface
    edit "lag1"
        set vdom "root"
        set ip 10.20.10.1 255.255.255.0
        set allowaccess ping https ssh http
        set type aggregate
        set member "port3" "port4"
        set lacp-mode active
        set lacp-speed 1G
        set l2forward enable
        set description "LAG-to-Cisco-2960X"
    next
end

# ───────────────────────────────────────────────────────────────
# 3. CONFIGURATION DES PORTS MEMBRES
# ───────────────────────────────────────────────────────────────

config system interface
    edit "port3"
        set vdom "root"
        set type physical
        set member "lag1"
        set description "LAG-Member-1"
    next
    edit "port4"
        set vdom "root"
        set type physical
        set member "lag1"
        set description "LAG-Member-2"
    next
end

# ───────────────────────────────────────────────────────────────
# 4. CONFIGURATION DES INTERFACES VLAN
# ───────────────────────────────────────────────────────────────

config system interface
    edit "vlan10"
        set vdom "root"
        set ip 10.20.10.254 255.255.255.0
        set allowaccess ping https ssh http
        set type vlan
        set interface "lag1"
        set vlanid 10
        set description "VLAN-Admin"
    next
    edit "vlan50"
        set vdom "root"
        set ip 10.20.50.254 255.255.255.0
        set allowaccess ping
        set type vlan
        set interface "lag1"
        set vlanid 50
        set description "VLAN-PC"
    next
    edit "vlan99"
        set vdom "root"
        set type vlan
        set interface "lag1"
        set vlanid 99
        set description "VLAN-Native-Trunk"
    next
    edit "vlan100"
        set vdom "root"
        set ip 10.20.100.254 255.255.255.0
        set allowaccess ping
        set type vlan
        set interface "lag1"
        set vlanid 100
        set description "VLAN-IoT"
    next
    edit "vlan200"
        set vdom "root"
        set ip 10.20.200.254 255.255.255.0
        set allowaccess ping
        set type vlan
        set interface "lag1"
        set vlanid 200
        set description "VLAN-VoIP"
    next
    edit "vlan1000"
        set vdom "root"
        set ip 10.20.1000.254 255.255.255.0
        set allowaccess ping
        set type vlan
        set interface "lag1"
        set vlanid 1000
        set description "VLAN-Merdouille-Transition"
    next
end

# ───────────────────────────────────────────────────────────────
# 5. ADRESSES IP (SUBNETS)
# ───────────────────────────────────────────────────────────────

config firewall address
    edit "Admin_Subnet"
        set subnet 10.20.10.0 255.255.255.0
        set comment "VLAN 10 - Admin"
    next
    edit "PC_Subnet"
        set subnet 10.20.50.0 255.255.255.0
        set comment "VLAN 50 - PC"
    next
    edit "IoT_Subnet"
        set subnet 10.20.100.0 255.255.255.0
        set comment "VLAN 100 - IoT"
    next
    edit "VoIP_Subnet"
        set subnet 10.20.200.0 255.255.255.0
        set comment "VLAN 200 - VoIP"
    next
    edit "Merdouille_Subnet"
        set subnet 10.20.1000.0 255.255.255.0
        set comment "VLAN 1000 - Transition"
    next
end

# ───────────────────────────────────────────────────────────────
# 6. POLITIQUES FIREWALL
# ───────────────────────────────────────────────────────────────

config firewall policy
    edit 1
        set name "Admin-to-Internet"
        set srcintf "vlan10"
        set dstintf "wan1"
        set srcaddr "Admin_Subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat enable
        set logtraffic all
        set comments "VLAN Admin - Accès Internet complet"
    next
    edit 2
        set name "PC-to-Internet-Filtered"
        set srcintf "vlan50"
        set dstintf "wan1"
        set srcaddr "PC_Subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS"
        set nat enable
        set utm-status enable
        set profile-protocol-options "deep-inspection"
        set logtraffic all
        set comments "VLAN PC - Internet filtré"
    next
    edit 3
        set name "IoT-BLOCK-ALL"
        set srcintf "vlan100"
        set dstintf "any"
        set srcaddr "IoT_Subnet"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "VLAN IoT - Isolation totale"
    next
    edit 4
        set name "Admin-to-IoT-Mgmt"
        set srcintf "vlan10"
        set dstintf "vlan100"
        set srcaddr "Admin_Subnet"
        set dstaddr "IoT_Subnet"
        set action accept
        set schedule "always"
        set service "PING" "SSH" "HTTP" "HTTPS"
        set logtraffic all
        set comments "VLAN Admin vers IoT - Management uniquement"
    next
    edit 5
        set name "VoIP-to-SIP-Provider"
        set srcintf "vlan200"
        set dstintf "wan1"
        set srcaddr "VoIP_Subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "SIP" "RTP"
        set nat enable
        set logtraffic all
        set comments "VLAN VoIP - Trafic SIP/RTP uniquement"
    next
    edit 6
        set name "Merdouille-BLOCK-ALL"
        set srcintf "vlan1000"
        set dstintf "any"
        set srcaddr "Merdouille_Subnet"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "VLAN Merdouille - Isolation temporaire"
    next
end

# ───────────────────────────────────────────────────────────────
# 7. CONFIGURATION DHCP SERVER
# ───────────────────────────────────────────────────────────────

config system dhcp server
    edit 1
        set interface "vlan10"
        set dns-service default
        set default-gateway 10.20.10.254
        set netmask 255.255.255.0
        set ip-mode range
        set start-ip 10.20.10.100
        set end-ip 10.20.10.200
        set lease-time 86400
    next
    edit 2
        set interface "vlan50"
        set dns-service default
        set default-gateway 10.20.50.254
        set netmask 255.255.255.0
        set ip-mode range
        set start-ip 10.20.50.100
        set end-ip 10.20.50.200
        set lease-time 43200
    next
    edit 3
        set interface "vlan100"
        set dns-service default
        set default-gateway 10.20.100.254
        set netmask 255.255.255.0
        set ip-mode range
        set start-ip 10.20.100.100
        set end-ip 10.20.100.200
        set lease-time 604800
    next
    edit 4
        set interface "vlan200"
        set dns-service default
        set default-gateway 10.20.200.254
        set netmask 255.255.255.0
        set ip-mode range
        set start-ip 10.20.200.100
        set end-ip 10.20.200.200
        set lease-time 86400
    next
    edit 5
        set interface "vlan1000"
        set dns-service default
        set default-gateway 10.20.1000.254
        set netmask 255.255.255.0
        set ip-mode range
        set start-ip 10.20.1000.100
        set end-ip 10.20.1000.200
        set lease-time 3600
    next
end

# ───────────────────────────────────────────────────────────────
# 8. RÉSERVATIONS DHCP (À COMPLÉTER AVEC LES VRAIES MAC)
# ───────────────────────────────────────────────────────────────

config system dhcp reservation
    edit 1
        set ip 10.20.10.1
        set mac "XX:XX:XX:XX:XX:01"
        set server-id 1
        set description "Fortigate-Mgmt"
    next
    edit 2
        set ip 10.20.10.2
        set mac "XX:XX:XX:XX:XX:02"
        set server-id 1
        set description "Cisco-Switch-Mgmt"
    next
    edit 3
        set ip 10.20.10.10
        set mac "XX:XX:XX:XX:XX:03"
        set server-id 1
        set description "Windows-Server-DHCP-DNS"
    next
    edit 4
        set ip 10.20.10.20
        set mac "XX:XX:XX:XX:XX:04"
        set server-id 1
        set description "Proxmox-VE"
    next
    edit 5
        set ip 10.20.10.30
        set mac "XX:XX:XX:XX:XX:05"
        set server-id 1
        set description "TrueNAS-Scale"
    next
    edit 6
        set ip 10.20.10.40
        set mac "XX:XX:XX:XX:XX:06"
        set server-id 1
        set description "QNAP-Backup"
    next
    edit 7
        set ip 10.20.10.50
        set mac "XX:XX:XX:XX:XX:07"
        set server-id 1
        set description "PC-Admin-Principal"
    next
end

# ───────────────────────────────────────────────────────────────
# 9. ROUTAGE STATIQUE
# ───────────────────────────────────────────────────────────────

config router static
    edit 1
        set device "wan1"
        set gateway 0.0.0.0
        set distance 10
    next
end

# ───────────────────────────────────────────────────────────────
# 10. SÉCURITÉ ADDITIONNELLE
# ───────────────────────────────────────────────────────────────

config system global
    set admin-scp disable
    set admin-telnet disable
    set admin-ssh-v1-0 disable
end

config system settings
    set admin-login-max 5
    set admin-lockout-threshold 5
    set admin-lockout-duration 600
end

# ───────────────────────────────────────────────────────────────
# FIN DE CONFIGURATION
# ───────────────────────────────────────────────────────────────